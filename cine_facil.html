<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cine Fácil | Compra de Ingressos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 32px 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #101827, #263b59);
      color: #172033; display: flex; align-items: center; justify-content: center;
    }
    .container {
      width: 100%; max-width: 620px; background: #fff; border-radius: 18px;
      padding: 32px; box-shadow: 0 18px 50px #0005;
    }
    header { text-align: center; margin-bottom: 26px; }
    .icon { font-size: 42px; }
    h1 { margin: 8px 0; color: #172b4d; font-size: 28px; }
    header p { margin: 0; color: #64748b; }
    .field { margin: 18px 0; }
    label { display: block; font-weight: 700; margin-bottom: 8px; color: #27364b; }
    select, input {
      width: 100%; padding: 13px 14px; border: 1px solid #cbd5e1;
      border-radius: 9px; font-size: 16px; background: #fff; color: #172033;
    }
    select:focus, input:focus { outline: 3px solid #bfdbfe; border-color: #2563eb; }
    .quantidades { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .preco { display: block; color: #64748b; font-size: 13px; font-weight: 400; margin-top: 4px; }
    button {
      width: 100%; border: 0; border-radius: 10px; padding: 14px;
      font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 18px;
      background: #2563eb; color: white; transition: background .2s;
    }
    button:hover { background: #1d4ed8; }
    .secondary { background: #e2e8f0; color: #334155; margin-top: 10px; }
    .secondary:hover { background: #cbd5e1; }
    .resultado {
      display: none; margin-top: 22px; padding: 20px; border-radius: 12px;
      background: #eff6ff; border: 1px solid #bfdbfe;
    }
    .resultado h2 { margin: 0 0 12px; color: #1e40af; font-size: 20px; }
    .linha { display: flex; justify-content: space-between; gap: 12px; margin: 8px 0; }
    .total {
      border-top: 1px solid #bfdbfe; margin-top: 14px; padding-top: 14px;
      font-size: 21px; font-weight: 800; color: #1e40af;
    }
    .aviso { color: #b91c1c; font-size: 14px; min-height: 18px; margin-top: 8px; }
    footer { text-align: center; margin-top: 24px; color: #94a3b8; font-size: 12px; }
    @media (max-width: 480px) {
      .container { padding: 23px 18px; }
      .quantidades { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div class="icon" aria-hidden="true">🎬</div>
      <h1>Cine Fácil</h1>
      <p>Escolha seu filme e compre seus ingressos!</p>
    </header>

    <form id="formCompra">
      <div class="field">
        <label for="filme">Filme</label>
        <select id="filme" required>
          <option value="">Selecione um filme</option>
          <option>Divertida Mente 2</option>
          <option>Homem-Aranha: Através do Aranhaverso</option>
          <option>Moana 2</option>
          <option>Interestelar</option>
          <option>Como Treinar o Seu Dragão</option>
        </select>
      </div>

      <div class="field">
        <label for="sessao">Sessão</label>
        <select id="sessao" required>
          <option value="">Selecione um horário</option>
          <option>14:00</option>
          <option>16:30</option>
          <option>19:00</option>
          <option>21:30</option>
        </select>
      </div>

      <div class="quantidades">
        <div class="field">
          <label for="inteira">Ingressos inteiros <span class="preco">R$ 32,00 cada</span></label>
          <input id="inteira" type="number" min="0" step="1" value="0" required>
        </div>
        <div class="field">
          <label for="meia">Meias-entradas <span class="preco">R$ 16,00 cada</span></label>
          <input id="meia" type="number" min="0" step="1" value="0" required>
        </div>
      </div>

      <div id="aviso" class="aviso" role="alert"></div>
      <button type="submit">Calcular total</button>
      <button type="reset" class="secondary">Limpar formulário</button>
    </form>

    <section id="resultado" class="resultado" aria-live="polite">
      <h2>Resumo da compra</h2>
      <div class="linha"><span>Filme:</span><strong id="resFilme"></strong></div>
      <div class="linha"><span>Sessão:</span><strong id="resSessao"></strong></div>
      <div class="linha"><span>Ingressos inteiros:</span><strong id="resInteira"></strong></div>
      <div class="linha"><span>Meias-entradas:</span><strong id="resMeia"></strong></div>
      <div class="linha total"><span>Total a pagar:</span><strong id="resTotal"></strong></div>
    </section>

    <footer>Projeto educativo desenvolvido em HTML, CSS e JavaScript.</footer>
  </main>

  <script>
    const form = document.getElementById('formCompra');
    const resultado = document.getElementById('resultado');
    const aviso = document.getElementById('aviso');

    const moeda = valor => valor.toLocaleString('pt-BR', {
      style: 'currency', currency: 'BRL'
    });

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      aviso.textContent = '';

      const filme = document.getElementById('filme').value;
      const sessao = document.getElementById('sessao').value;
      const inteira = Number(document.getElementById('inteira').value);
      const meia = Number(document.getElementById('meia').value);

      if (!filme || !sessao) {
        aviso.textContent = 'Selecione o filme e a sessão.';
        resultado.style.display = 'none';
        return;
      }
      if (!Number.isInteger(inteira) || !Number.isInteger(meia) ||
          inteira < 0 || meia < 0) {
        aviso.textContent = 'Informe quantidades inteiras e não negativas.';
        resultado.style.display = 'none';
        return;
      }
      if (inteira + meia === 0) {
        aviso.textContent = 'Informe pelo menos um ingresso.';
        resultado.style.display = 'none';
        return;
      }

      const total = (inteira * 32) + (meia * 16);

      document.getElementById('resFilme').textContent = filme;
      document.getElementById('resSessao').textContent = sessao;
      document.getElementById('resInteira').textContent =
        `${inteira} × ${moeda(32)} = ${moeda(inteira * 32)}`;
      document.getElementById('resMeia').textContent =
        `${meia} × ${moeda(16)} = ${moeda(meia * 16)}`;
      document.getElementById('resTotal').textContent = moeda(total);

      resultado.style.display = 'block';
    });

    form.addEventListener('reset', function() {
      aviso.textContent = '';
      resultado.style.display = 'none';
    });
  </script>
</body>
</html>
